<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Australia Summer Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* Layout: signage header + plan switch, then Google map (sticky) beside a tabbed panel: itinerary, all activities, car list */
:root {
  --bg: #f3f6f4; --surface: #ffffff; --fg: #14231f; --muted: #5b6c66; --line: #d6dfdb;
  --ocean: #d3e7ee; --flight: #1f5fa8; --road: #2f8a4e; --accent: #d1602a; --accent-ink: #ffffff;
  --in: #2f8a4e; --in-bg: #e3f2e7; --out: #6b7570; --out-bg: #eceeed; --any: #1f5fa8; --any-bg: #e4edf8;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1716; --surface: #142220; --fg: #e4ece9; --muted: #93a6a0; --line: #263935;
    --ocean: #0f2a35; --flight: #6aa8f0; --road: #5cc27d; --accent: #f08a52; --accent-ink: #1a0c04;
    --in: #7fd69a; --in-bg: #173323; --out: #93a6a0; --out-bg: #1d2a28; --any: #8dbcf3; --any-bg: #172a3d; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px; }
.wrap { max-width: 1200px; margin: 0 auto; display: grid; gap: 24px; }
header { display: grid; gap: 6px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 7vw, 72px); line-height: .95; margin: 0; text-transform: uppercase; text-wrap: balance; }
h1 span { color: var(--accent); }
.facts { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 8px; font-variant-numeric: tabular-nums; color: var(--muted); }
.facts b { font-family: var(--display); font-size: 22px; font-weight: 800; margin-right: 4px; color: var(--fg); }
.planbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 10px; }
.plannote { font-size: 13px; color: var(--muted); max-width: 70ch; }

.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button { font: 600 13px var(--body); border: 0; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
button:focus-visible, a:focus-visible, .stop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 24px; align-items: start; }
@media (max-width: 880px) { .main { grid-template-columns: minmax(0, 1fr); } }
.mapcard { position: sticky; top: 12px; display: grid; gap: 10px; }
@media (max-width: 880px) { .mapcard { position: static; } }
.mapbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 22px; vertical-align: middle; margin-right: 6px; border-top: 3px solid; }
.legend .lf { border-color: var(--flight); border-top-style: dashed; }
.legend .lr { border-color: var(--road); }
.map { position: relative; width: 100%; aspect-ratio: 1 / 1; max-height: 78vh; border-radius: 14px; overflow: hidden; background: var(--ocean); border: 1px solid var(--line); z-index: 0; }
.leaflet-container { font-family: var(--body); background: var(--ocean); }
.pinwrap { display: flex; align-items: center; gap: 6px; white-space: nowrap; pointer-events: auto; }
.pinwrap.l { flex-direction: row-reverse; }
.pdot { min-width: 24px; height: 24px; padding: 0 5px; border-radius: 12px; background: #fff; border: 2px solid #14231f; color: #14231f; font: 500 11px var(--mono); display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.pin-on .pdot { background: #d1602a; border-color: #d1602a; color: #fff; box-shadow: 0 0 0 6px rgba(209,96,42,.3); }
.plbl { font: 600 13px var(--body); color: #14231f; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; }
.pin-on { z-index: 1000 !important; }
.far .pinwrap[data-c="byr"] .plbl, .far .pinwrap[data-c="bow"] .plbl { display: none; }
.hint, .maplinks { font-size: 13px; color: var(--muted); }
.maplinks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
a { color: var(--flight); text-underline-offset: 3px; }

.panel { display: grid; gap: 12px; min-width: 0; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { font: 700 15px var(--display); font-size: 20px; text-transform: uppercase; letter-spacing: .03em; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs .count { font-family: var(--mono); font-size: 11px; margin-left: 4px; }

.list { display: grid; gap: 10px; }
.stop { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; }
.stop.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); cursor: default; }
.badge { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--fg); display: grid; place-items: center; font-family: var(--mono); font-size: 14px; }
.stop.on .badge { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.body { display: grid; gap: 6px; min-width: 0; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; }
.stop h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 24px; text-transform: uppercase; line-height: 1.1; }
.when { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.flex { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); border: 1px solid var(--accent); padding: 0 5px; border-radius: 4px; margin-left: 6px; }
.travel { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: baseline; }
.mode { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; color: #fff; white-space: nowrap; }
.mode.fly { background: #1f5fa8; } .mode.drive { background: #2f8a4e; } .mode.land { background: #5b6c66; }
.mainact { display: flex; gap: 8px; align-items: baseline; font-weight: 600; }
.mainact .star { color: var(--accent); font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.more { font-size: 13px; color: var(--muted); }
.opts { display: grid; gap: 2px; margin-top: 6px; border-top: 1px solid var(--line); padding-top: 8px; }
.opts h4 { margin: 4px 0 2px; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }

.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.item:last-child { border-bottom: 0; }
.item .t { font-weight: 600; }
.item .n { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.item .meta { display: flex; flex-wrap: wrap; gap: 4px; justify-content: end; align-items: start; }
.chip { font-family: var(--mono); font-size: 11px; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.chip.in { color: var(--in); background: var(--in-bg); }
.chip.out { color: var(--out); background: var(--out-bg); }
.chip.any { color: var(--any); background: var(--any-bg); }
.chip.cat { color: var(--muted); border: 1px solid var(--line); }
.chip.link { color: var(--flight); border: 1px solid var(--line); text-decoration: none; }
.chip.link:hover { border-color: var(--flight); }
.item .t a { color: inherit; text-decoration-color: var(--line); }
.item .t a:hover { color: var(--flight); }
.chip.wish { color: var(--accent); border: 1px solid var(--accent); }

.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.fchip { font: 600 13px var(--body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.fchip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; }
.group h3 { margin: 4px 0; font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.group h3 small { font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 500; text-transform: none; }
.callout { font-size: 13px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.callout b { color: var(--fg); }
.email { font-family: var(--mono); font-size: 12px; user-select: all; }
.empty { color: var(--muted); font-size: 14px; padding: 12px 0; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head><body>
<div class="wrap">
  <header>
    <div class="eyebrow">2–22 December 2026 · in and out of Sydney · draft to agree with Tom</div>
    <h1>Australia <span>Summer Run</span></h1>
    <div class="facts" id="facts"></div>
    <div class="planbar">
      <div class="seg" role="group" aria-label="Route plan">
        <button id="p-A" type="button">Plan A · no car stop</button>
        <button id="p-B" type="button">Plan B · + Porsche party</button>
      </div>
      <div class="plannote" id="plannote"></div>
    </div>
  </header>

  <section class="main">
    <div class="mapcard">
      <div class="mapbar">
        <div class="seg" role="group" aria-label="Map view">
          <button id="v-all" type="button">Whole trip</button>
          <button id="v-east" type="button">East coast</button>
          <button id="v-stop" type="button">Selected stop</button>
        </div>
        <div class="legend"><span><i class="lf"></i>Flight</span><span><i class="lr"></i>Drive</span></div>
      </div>
      <div class="map" id="mapbox" role="region" aria-label="Trip map"></div>
      <div class="hint">Drag and zoom freely. Click a pin or a city to see everything on there.</div>
      <div class="maplinks" id="maplinks"></div>
    </div>

    <div class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="t-itin" type="button">Itinerary</button>
        <button role="tab" id="t-all" type="button">All activities<span class="count" id="c-all"></span></button>
        <button role="tab" id="t-cars" type="button">Cars &amp; track<span class="count" id="c-cars"></span></button>
      </div>
      <div id="view"></div>
    </div>
  </section>
</div>

  { id: "gc-porschetrack", c: "gc", cat: "track", t: "Porsche Track Experience / advanced driver training", n: "Australia has no Porsche Experience Centre; this is the closest thing. Full-day courses in Porsches for owners and non-owners, at RACQ Mt Cotton (40 min from the Gold Coast) or Queensland Raceway. Gold Coast session listed at $1,613. Dates are set by Porsche, so ask about December.", days: null, check: 1, q: "RACQ Mobility Centre of Excellence Mount Cotton", url: "https://dealer.porsche.com/au/goldcoast/en-AU/Advanced-Driver-Training" },
  { id: "gc-drift", c: "gc", cat: "track", t: "Learn to drift, Queensland Raceway", n: "Half day $399–449 or full day $619–699 with pro drift drivers, ending on a driftkhana course. Ipswich, about 1¼ h from the Gold Coast.", days: null, q: "Queensland Raceway Willowbank", url: "https://www.adrenaline.com.au/brisbane/drifting/learn-to-drift-queensland-raceway/" },
  { id: "gc-v8", c: "gc", cat: "track", t: "Drive a V8 race car, Queensland Raceway", n: "5 laps in a Ford or Holden with an instructor, about $240–270.", days: null, q: "Queensland Raceway Willowbank", url: "https://memberbenefits.experienceoz.com.au/en/qld-other/v8-race-car-driving-experience-5-laps" },

  { id: "gc-jcc", c: "gc", cat: "cars", t: "JUST CARS & COFFEE Brisbane", n: "Monthly weekend meet at Café Elle, Geebung, done by 9am. About 1¼ h from the Gold Coast.", days: null, check: 1 },
  { id: "gc-shannons", c: "gc", cat: "cars", t: "Shannons Cars & Coffee Brisbane", n: "Shannons Eagle Farm has run a December edition; 2026 date not confirmed.", days: null, check: 1 },
  // Byron
  { id: "byr-surf", c: "byr", cat: "out", t: "Surf lesson + Cape Byron lighthouse walk", n: "", days: null },
  { id: "byr-beachhotel", c: "byr", cat: "party", t: "Beach Hotel and Byron bars", n: "Live music most nights.", days: null },
  { id: "byr-dizzee", c: "byr", cat: "party", t: "Dizzee Rascal at The Beach Hotel", n: "Sunday show, before you arrive.", days: [6], check: 1 },
  { id: "byr-skydive", c: "byr", cat: "thrill", t: "Skydive Byron Bay", n: "Second chance at a jump if Airlie doesn’t happen.", days: null },
  { id: "byr-market", c: "byr", cat: "culture", t: "Byron Community Market", n: "First Sunday, plus a special summer market on the third Sunday.", days: [6, 20] },
  { id: "byr-kayak", c: "byr", cat: "out", t: "Sea kayak with dolphins", n: "", days: null },
  // Port Stephens
  { id: "ps-buggy", c: "ps", cat: "thrill", wish: 1, t: "Stockton Beach dune buggy / quad bikes", n: "Biggest coastal dunes in the southern hemisphere.", days: null },
  { id: "ps-sandboard", c: "ps", cat: "thrill", t: "Sandboarding on the dunes", n: "", days: null },
  { id: "ps-dolphins", c: "ps", cat: "out", t: "Dolphin cruise from Nelson Bay", n: "", days: null },
  { id: "ps-carshow", c: "ps", cat: "cars", t: "Maddie Hill Car, Truck & Bike Show (10th year)", n: "Newcastle Kart Racing Club, 45 min from Nelson Bay. Charity show.", days: [13], check: 1 },
  { id: "ps-hunter", c: "ps", cat: "culture", t: "Hunter Valley wine day", n: "1 h inland.", days: null },
];
const QMAP = {"syd-harbour": "BridgeClimb Sydney", "syd-clubs": "Ivy Pool Club Sydney", "syd-mos": "The Domain Sydney", "syd-shannons": "Shannons Sydney Silverwater", "syd-forby": "Sydney Dragway", "syd-macchiato": "Northern Beaches Sydney", "syd-skydive": "Skydive Sydney Wollongong", "syd-bondi": "Bondi to Coogee Coastal Walk", "syd-carols": "The Domain Sydney", "bow-porsche": "Peppers Craigieburn Bowral", "bow-bathurst": "Mount Panorama Circuit Bathurst", "bow-falls": "Fitzroy Falls", "hob-mona": "MONA Museum of Old and New Art", "hob-salamanca": "Salamanca Market Hobart", "hob-kunanyi": "kunanyi Mount Wellington Descent bike", "hob-bruny": "Bruny Island", "hob-carshow": "King Street Oval Campbell Town Tasmania", "hob-taste": "Princes Wharf 1 Hobart", "air-sail": "Whitehaven Beach", "air-skydive": "Skydive Airlie Beach", "air-heart": "Heart Reef scenic flight Airlie Beach", "air-jetski": "Whitsunday Jetski Tours Airlie Beach", "air-markets": "Airlie Beach Markets", "air-bars": "Airlie Beach Esplanade bars", "noo-kart": "Big Kart Track Landsborough", "noo-kgari": "Kgari Fraser Island", "noo-zoo": "Australia Zoo", "noo-np": "Noosa National Park", "noo-market": "Pomona Queensland", "gc-spilt": "Gold Coast Sports Precinct Carrara", "gc-parks": "Warner Bros. Movie World", "gc-dirt": "dirt bike tours Gold Coast hinterland", "gc-kart": "Kingston Park Raceway", "gc-jet": "Paradise Jet Boating Gold Coast", "gc-clubs": "Orchid Avenue Surfers Paradise", "gc-porsche": "Porsche Centre Gold Coast", "gc-jcc": "Cafe Elle Geebung", "gc-shannons": "Shannons Brisbane Eagle Farm", "byr-surf": "Cape Byron Lighthouse", "byr-beachhotel": "Beach Hotel Byron Bay", "byr-dizzee": "Beach Hotel Byron Bay", "byr-skydive": "Skydive Byron Bay", "byr-market": "Byron Bay Community Market", "byr-kayak": "Go Sea Kayak Byron Bay", "ps-buggy": "Stockton Beach Sand Dunes quad bike tours", "ps-sandboard": "Sand Dune Adventures Port Stephens", "ps-dolphins": "Nelson Bay dolphin watching cruise", "ps-carshow": "Newcastle Kart Racing Club", "ps-hunter": "Hunter Valley wineries Pokolbin"};
const NOT_FOUND = "No December 2026 race events found at Sydney Motorsport Park, Willowbank Raceway, Queensland Raceway, Lakeside Park or Baskerville. The Supercars season finale is in Adelaide (3–6 Dec), off this route.";

/* ---------- state ---------- */
let plan = "A", sel = 4, tab = "itin", cat = "all", onlyIn = false;
try { const s = JSON.parse(localStorage.getItem("trip-ui") || "{}"); if (s.plan in PLANS) plan = s.plan; if (s.tab) tab = s.tab; } catch (e) {}
const save = () => { try { localStorage.setItem("trip-ui", JSON.stringify({ plan, tab })); } catch (e) {} };
const stops = () => PLANS[plan].stops;
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const day = d => `${DOW[(d + 1) % 7]} ${d} Dec`;
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

function status(act) {
  const visits = stops().filter(s => s.c === act.c);
  if (!visits.length) return { k: "out", txt: "not on this plan" };
  if (!act.days) return { k: "any", txt: "any day" };
  const hit = act.days.filter(d => visits.some(v => d >= v.a && d <= v.b));
  if (hit.length) return { k: "in", txt: hit.map(day).join(", ") + " · in our dates" };
  return { k: "out", txt: act.days.map(day).join(", ") + " · outside our dates" };
}

function itemHTML(a, showCity) {
  const st = status(a);
  const q = a.q || QMAP[a.id] || `${a.t}, ${CITY[a.c].name}`;
  const gm = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
  return `<div class="item"><span class="t"><a href="${gm}" target="_blank" rel="noopener" title="Open in Google Maps (reviews, photos)">${esc(a.t)}</a>${showCity ? ` <span class="when">· ${CITY[a.c].name}</span>` : ""}</span>
    <span class="meta"><span class="chip ${st.k}">${st.txt}</span></span>
    <span class="n">${esc(a.n)}${a.check ? " <em>Confirm before booking.</em>" : ""}</span>
    <span class="meta" style="grid-column:1/-1;justify-content:start"><span class="chip cat">${CATS[a.cat]}</span>${a.wish ? '<span class="chip wish">wishlist</span>' : ""}<a class="chip link" href="${gm}" target="_blank" rel="noopener">Google Maps ↗</a>${a.url ? `<a class="chip link" href="${a.url}" target="_blank" rel="noopener">Book ↗</a>` : ""}</span></div>`;
}

/* ---------- header ---------- */
function renderHeader() {
  const S = stops();
  const flights = S.filter(s => s.go[0] === "fly").length;
  const places = new Set(S.map(s => s.c)).size;
  const inCars = ACTS.filter(a => a.cat === "cars" && status(a).k === "in").length;
  document.getElementById("facts").innerHTML =
    `<div><b>20</b>nights</div><div><b>${places}</b>places</div><div><b>${flights}</b>flights</div><div><b>~1,040</b>km coastal drive</div><div><b>13 Dec</b>Spilt Milk</div><div><b>${inCars}</b>car events in our dates</div>`;
  document.getElementById("plannote").textContent = PLANS[plan].note;
  ["A", "B"].forEach(p => document.getElementById("p-" + p).setAttribute("aria-pressed", plan === p));
}

/* ---------- panel ---------- */
function renderPanel() {
  ["itin", "all", "cars"].forEach(t => document.getElementById("t-" + t).setAttribute("aria-selected", tab === t));
  document.getElementById("c-all").textContent = ACTS.length;
  document.getElementById("c-cars").textContent = ACTS.filter(a => a.cat === "cars" || a.cat === "track").length;
  const v = document.getElementById("view");
  if (tab === "itin") v.innerHTML = itinHTML();
  else if (tab === "all") v.innerHTML = allHTML();
  else v.innerHTML = carsHTML();
  v.querySelectorAll(".stop").forEach(el => el.addEventListener("click", () => { if (+el.dataset.i !== sel) select(+el.dataset.i, true); }));
  v.querySelectorAll("[data-cat]").forEach(el => el.addEventListener("click", () => { cat = el.dataset.cat; renderPanel(); }));
  v.querySelectorAll("[data-only]").forEach(el => el.addEventListener("click", () => { onlyIn = !onlyIn; renderPanel(); }));
}

function itinHTML() {
  return `<div class="list">` + stops().map((s, i) => {
    const n = s.b - s.a, on = i === sel;
    const main = ACTS.find(a => a.id === s.main);
    const others = ACTS.filter(a => a.c === s.c && a.id !== s.main && !(s.c === "syd" && (a.id === "syd-harbour" || a.id === "syd-clubs")));
    const label = { fly: "Fly", drive: "Drive", land: "Arrive" }[s.go[0]];
    let opts = "";
    if (on) {
      const byStatus = k => others.filter(a => status(a).k === k);
      const sect = (h, list) => list.length ? `<h4>${h}</h4>` + list.map(a => itemHTML(a)).join("") : "";
      opts = `<div class="opts">${itemHTML(main).replace('class="item"', 'class="item" style="border-bottom:1px solid var(--line)"')}
        ${sect("Happening while we’re there", byStatus("in"))}${sect("Any day", byStatus("any"))}${sect("Other dates (could change the route)", byStatus("out"))}</div>`;
    }
    return `<div class="stop${on ? " on" : ""}" data-i="${i}" tabindex="0" role="button" aria-expanded="${on}">
      <div class="badge">${i + 1}</div>
      <div class="body">
        <div class="top"><h3>${CITY[s.c].name}</h3><span class="when">${day(s.a)} – ${day(s.b)} · ${n} night${n === 1 ? "" : "s"}${n === 3 ? '<span class="flex">3 nights?</span>' : ""}</span></div>
        <div class="travel"><span class="mode ${s.go[0]}">${label}</span><span>${esc(s.go[1])}</span></div>
        <div class="mainact"><span class="star">Main</span><span>${esc(main.t)}</span></div>
        ${on ? opts : `<div class="more">+ ${others.length} more options · click to open</div>`}
      </div></div>`;
  }).join("") + `</div>`;
}

function filterBar() {
  return `<div class="filters"><button class="fchip" type="button" data-cat="all" aria-pressed="${cat === "all"}">All</button>` +
    Object.entries(CATS).map(([k, l]) => `<button class="fchip" type="button" data-cat="${k}" aria-pressed="${cat === k}">${l}</button>`).join("") +
    `<button class="fchip" type="button" data-only aria-pressed="${onlyIn}">Only dated events in our dates</button></div>`;
}

function allHTML() {
  const seen = new Set();
  const order = stops().map(s => s.c).filter(c => !seen.has(c) && seen.add(c));
  Object.keys(CITY).forEach(c => { if (!seen.has(c)) order.push(c); });
  let html = filterBar();
  let total = 0;
  order.forEach(c => {
    const list = ACTS.filter(a => a.c === c && (cat === "all" || a.cat === cat) && (!onlyIn || status(a).k === "in"));
    if (!list.length) return;
    total += list.length;
    const visits = stops().filter(s => s.c === c);
    const when = visits.length ? visits.map(v => `${v.a}–${v.b} Dec`).join(" & ") : "not on this plan";
    html += `<div class="group"><h3>${CITY[c].name}<small>${when}</small></h3>${list.map(a => itemHTML(a)).join("")}</div>`;
  });
  if (!total) html += `<div class="empty">Nothing matches. Turn off “Only dated events in our dates” or pick another category.</div>`;
  return `<div class="list">${html}</div>`;
}

function carsHTML() {
  const list = ACTS.filter(a => a.cat === "cars" || a.cat === "track").sort((x, y) => (x.days ? x.days[0] : 99) - (y.days ? y.days[0] : 99));
  return `<div class="list">
    <div class="callout"><b>Parking-lot list.</b> Race-car drives, drift schools and car shows along or near the route. Track experiences run on most days, so they can slot in anywhere; the shows and meets are date-bound. None of them is worth bending the whole trip for, but a few line up with our dates. The Porsche Club party is the one Plan B is built around: email <span class="email">social@pcnsw.com.au</span> to check whether non-members can come.</div>
    <div class="group">${list.map(a => itemHTML(a, true)).join("")}</div>
    <div class="callout">${NOT_FOUND}</div></div>`;
}

/* ---------- map ---------- */
const box = document.getElementById("mapbox");
let view = "all", layer = null;
const lmap = L.map(box, { zoomControl: true, scrollWheelZoom: true, worldCopyJump: false }).setView([-30, 150], 5);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(lmap);
const farCheck = () => box.classList.toggle("far", lmap.getZoom() < 7);
lmap.on("zoomend", farCheck);
const BOUNDS = { all: [[-19.6, 146.0], [-43.2, 154.2]], east: [[-19.9, 148.0], [-35.0, 154.0]] };
const ll = c => [CITY[c].lat, CITY[c].lon];

function arc(a, b) {
  const [y1, x1] = a, [y2, x2] = b, dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1, bend = Math.min(0.22 * len, 4);
  const cx = (x1 + x2) / 2 + dy / len * bend, cy = (y1 + y2) / 2 - dx / len * bend, pts = [];
  for (let t = 0; t <= 1.0001; t += 0.05) pts.push([(1 - t) ** 2 * y1 + 2 * (1 - t) * t * cy + t * t * y2, (1 - t) ** 2 * x1 + 2 * (1 - t) * t * cx + t * t * x2]);
  return pts;
}

function renderMap() {
  if (layer) layer.remove();
  layer = L.layerGroup().addTo(lmap);
  const S = stops();
  const road = { color: "#2f8a4e", weight: 5, opacity: .9 }, fly = { color: "#1f5fa8", weight: 3, dashArray: "8 7", opacity: .9 };
  for (let i = 1; i < S.length; i++) {
    const from = S[i - 1].c, to = S[i].c;
    if (S[i].go[0] === "fly") {
      // Bowral has no airport: drive to/from Sydney around the flight
      const ff = from === "bow" ? "syd" : from, tt = to === "bow" ? "syd" : to;
      if (ff !== from) L.polyline([ll(from), ll("syd")], road).addTo(layer);
      if (tt !== to) L.polyline([ll("syd"), ll(to)], road).addTo(layer);
      L.polyline(arc(ll(ff), ll(tt)), fly).addTo(layer);
    } else L.polyline([ll(from), ll(to)], road).addTo(layer);
  }
  const groups = {};
  S.forEach((s, i) => (groups[s.c] = groups[s.c] || []).push(i));
  Object.entries(groups).forEach(([c, idx]) => {
    const on = idx.includes(sel), left = CITY[c].lp === "l";
    const icon = L.divIcon({ className: on ? "pin-on" : "", iconSize: null, iconAnchor: [left ? 0 : 0, 12],
      html: `<div class="pinwrap ${left ? "l" : ""}" data-c="${c}" style="transform:translateX(${left ? "calc(-100% + 12px)" : "-12px"})"><span class="pdot">${idx.map(i => i + 1).join("·")}</span><span class="plbl">${CITY[c].name}</span></div>` });
    L.marker(ll(c), { icon, zIndexOffset: on ? 1000 : 0, title: CITY[c].name, keyboard: true }).addTo(layer)
      .on("click", () => { const next = idx.find(i => i !== sel); select(idx.includes(sel) && next !== undefined ? next : idx[0], false); });
  });
  ["all", "east", "stop"].forEach(v => document.getElementById("v-" + v).setAttribute("aria-pressed", view === v));
  const c = CITY[S[sel].c];
  document.getElementById("maplinks").innerHTML =
    `<a href="https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lon}" target="_blank" rel="noopener">Open ${c.name} in Google Maps</a>
     <a href="https://www.google.com/maps/dir/Noosa+Heads+QLD/Surfers+Paradise+QLD/Byron+Bay+NSW/Nelson+Bay+NSW/Sydney+NSW" target="_blank" rel="noopener">Road trip directions in Google Maps</a>`;
}
function moveCamera(animate) {
  const opt = { animate, duration: .8, padding: [24, 24] };
  if (view === "stop") lmap.flyTo(ll(stops()[sel].c), 11, { animate, duration: .8 });
  else lmap.flyToBounds(BOUNDS[view], opt);
}
box.addEventListener("wheel", () => { view = "custom"; ["all", "east", "stop"].forEach(v => document.getElementById("v-" + v).setAttribute("aria-pressed", false)); }, { passive: true });
lmap.on("dragstart", () => { view = "custom"; ["all", "east", "stop"].forEach(v => document.getElementById("v-" + v).setAttribute("aria-pressed", false)); });

/* ---------- actions ---------- */
function select(i, fromList) {
  sel = i;
  if (tab !== "itin") { tab = "itin"; save(); }
  renderPanel(); renderMap();
  if (!fromList) { /* pin click: keep the map where the user put it */ } else if (view === "stop") moveCamera(true);
  const card = document.querySelector(`.stop[data-i="${i}"]`);
  if (card && !fromList) card.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function renderAll() { renderHeader(); renderPanel(); renderMap(); }

function setPlan(p) {
  const c = stops()[sel].c;
  plan = p;
  const i = stops().findIndex(s => s.c === c);
  sel = i >= 0 ? i : Math.min(sel, stops().length - 1);
  save(); renderAll();
}
document.getElementById("p-A").addEventListener("click", () => setPlan("A"));
document.getElementById("p-B").addEventListener("click", () => setPlan("B"));
["itin", "all", "cars"].forEach(t => document.getElementById("t-" + t).addEventListener("click", () => { tab = t; save(); renderPanel(); }));
const setView = v => { view = v; renderMap(); moveCamera(true); };
["all", "east", "stop"].forEach(v => document.getElementById("v-" + v).addEventListener("click", () => setView(v)));
document.getElementById("view").addEventListener("keydown", e => { const s = e.target.closest(".stop"); if (s && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); s.click(); } });


sel = stops().findIndex(s => s.c === "gc");
renderAll();
lmap.fitBounds(BOUNDS.all, { padding: [24, 24] });
</script>
</body></html>
